services:
  - type: web
    name: rise-on-ai-sentiment
    runtime: python
    rootDir: scripts/inference-server
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: HF_TOKEN
        sync: false   # set this in Render dashboard → Environment
      - key: PORT
        value: "10000"
    healthCheckPath: /health
