# =============================================================================
# CI Workflow — Rise On AI
# =============================================================================
# Runs on every push and pull request to any branch.
# Pipeline: Install → Lint → Test → Build
#
# This workflow does NOT deploy. Deployment is handled by deploy.yml
# which only runs after this workflow passes on the main branch.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]          # every branch
  pull_request:
    branches: ["**"]          # every PR target

# Cancel in-progress runs for the same branch/PR to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup with npm cache ────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install dependencies (clean install, respects package-lock.json) ─
      - name: Install dependencies
        run: npm ci

      # ── 4. Lint ─────────────────────────────────────────────────────────────
      # Uses next lint (ESLint with Next.js core-web-vitals rules).
      # Fails the pipeline on any ESLint error.
      - name: Lint
        run: npm run lint

      # ── 5. Run tests ────────────────────────────────────────────────────────
      # Runs the full vitest suite (unit + integration + ai + security).
      # --reporter=verbose gives per-test output in the Actions log.
      # Environment variables are dummies — tests must not call real APIs.
      - name: Run tests
        run: npm run test -- --reporter=verbose
        env:
          # Provide dummy values so env-dependent imports don't throw at import time.
          # Tests themselves must mock Supabase and external APIs.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "dummy-recaptcha-key"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
          SENTIMENT_MODEL_API_URL: "https://dummy.huggingface.co/models/test"
          HUGGINGFACE_API_KEY: "hf_dummy"

      # ── 6. Build ────────────────────────────────────────────────────────────
      # Runs next build to catch TypeScript and webpack errors before deploy.
      # Uses real Supabase public vars (non-secret, already public in the app).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTIMENT_MODEL_API_URL: ${{ secrets.SENTIMENT_MODEL_API_URL }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}

      # ── 7. Upload build artifact (for deploy workflow to consume) ──────────
      - name: Upload .next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: |
            .next/
            public/
          retention-days: 1   # only needed for same-run deploy

  # ---------------------------------------------------------------------------
  # Auto-tag job — only runs on push to main, after ci job passes
  # ---------------------------------------------------------------------------
  # Reads the version from package.json and creates an annotated Git tag
  # (e.g. v2.0.1) if that tag does not already exist.
  #
  # How to trigger a new tag:
  #   1. Bump the version in package.json  (npm version patch / minor / major)
  #   2. Commit and push to main
  #   3. This job creates the tag automatically — no manual git tag needed
  # ---------------------------------------------------------------------------
  auto-tag:
    name: Auto-tag version from package.json
    runs-on: ubuntu-latest
    needs: ci                          # only runs if CI passes
    timeout-minutes: 5

    # Only tag on direct pushes to main — not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Write permission needed to push tags back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0               # full history needed to check existing tags

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="${{ steps.pkg.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists — skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist — will create."
          fi

      - name: Create and push annotated tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.pkg.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG — auto-tagged by CI on $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin "$TAG"
          echo "### 🏷️ Tagged $TAG" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Report skipped tagging
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "### ⏭️ Tag ${{ steps.pkg.outputs.version }} already exists — skipped" >> $GITHUB_STEP_SUMMARY
